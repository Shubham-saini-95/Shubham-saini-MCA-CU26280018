<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure and Caption</title>
</head>
<body>
    <h1>Photograph</h1>
    <figure>
        <img src="../kp.jpeg" alt="A car travelling along a road">
        <figcaption>A car travelling along the road.</figcaption>
    </figure>
</body>
</html>
