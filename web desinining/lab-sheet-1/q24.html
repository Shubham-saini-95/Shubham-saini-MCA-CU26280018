<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <h1>Feedback</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <p><label for="name">Name:</label> <input type="text" id="name" name="name"></p>
        <p><label for="comments">Comments:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="35"></textarea>
        </p>
        <p><label for="attachment">Upload a file:</label> <input type="file" id="attachment" name="attachment"></p>
        <button type="submit">Submit Feedback</button>
    </form>
</body>
</html>
