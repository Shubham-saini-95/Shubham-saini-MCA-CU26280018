<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <h1>Text Formatting Tags</h1>
    <p><b>This text uses bold.</b></p>
    <p><strong>This text is strongly important.</strong></p>
    <p><i>This text uses italic.</i></p>
    <p><em>This text is emphasized.</em></p>
    <p><u>This text is underlined.</u></p>
    <p><del>This text has been deleted.</del></p>
</body>
</html>
