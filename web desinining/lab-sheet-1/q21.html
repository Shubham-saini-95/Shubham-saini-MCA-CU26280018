<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>User Registration</h1>
    <form action="#" method="get">
        <p><label for="first-name">First Name:</label> <input type="text" id="first-name" name="firstName" required></p>
        <p><label for="last-name">Last Name:</label> <input type="text" id="last-name" name="lastName" required></p>
        <p><label for="email">Email:</label> <input type="email" id="email" name="email" required></p>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
