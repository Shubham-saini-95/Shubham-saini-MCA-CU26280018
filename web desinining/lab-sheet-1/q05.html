    <h1>Masala Tea</h1>
    <h2>Ingredients</h2>
    <p>Water, milk, tea leaves, sugar, and cardamom.</p>
    <hr>
    <h2>Method</h2>
    <p>Boil water with tea leaves and cardamom. Add milk and sugar, simmer, then strain into a cup.</p>
