<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Report</title>
</head>
<body>
    <h1>Monthly Financial Report</h1>
    <table border="1">
        <thead>
            <tr><th scope="col">Item</th><th scope="col">Amount</th></tr>
        </thead>
        <tbody>
            <tr><td>Salary</td><td>$50,000</td></tr>
            <tr><td>Other income</td><td>$5,000</td></tr>
            <tr><td>Expenses</td><td>-$20,000</td></tr>
        </tbody>
        <tfoot>
            <tr><th scope="row">Net total</th><th>$35,000</th></tr>
        </tfoot>
    </table>
</body>
</html>
