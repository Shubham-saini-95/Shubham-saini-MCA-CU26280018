    <title>How to Make Tea</title>

<body>
    <h1>How to Make Tea</h1>
    <ol>
        <li>Pour water into a saucepan and bring it to a boil.</li>
        <li>Add tea leaves and simmer for two minutes.</li>
        <li>Add milk and sugar to taste.</li>
        <li>Strain the tea into a cup and serve.</li>
    </ol>
</body>
