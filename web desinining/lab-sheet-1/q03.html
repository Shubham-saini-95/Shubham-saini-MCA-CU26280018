    <title>Heading Hierarchy</title>
</head>
<body>
    <h1>Heading Level 1</h1><p>This is the main page heading.</p>
    <h2>Heading Level 2</h2><p>This is a major section.</p>
    <h3>Heading Level 3</h3><p>This is a subsection.</p>
    <h4>Heading Level 4</h4><p>This is a smaller topic.</p>
    <h5>Heading Level 5</h5><p>This is a more specific detail.</p>
    <h6>Heading Level 6</h6><p>This is the smallest heading level.</p>
