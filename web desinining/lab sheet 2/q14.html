<!DOCTYPE html>
<html>

<head>
    <title>Range Slider</title>
</head>

<body>
    <h2>Volume</h2><input type="range" min="0" max="100" value="50" oninput="v.value=this.value"><span id="v">50</span>%
    <br><br><input type="number" min="0" max="100" oninput="n.innerText=this.value"><span id="n">0</span> units
</body>

</html>
