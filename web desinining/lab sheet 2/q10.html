<!DOCTYPE html>
<html>

<head>
    <title>Data Entry Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 30px auto
        }

        th,
        td {
            border: 1px solid #888;
            padding: 10px
        }

        tr:nth-child(even) {
            background: #eee
        }

        tr:hover {
            background: #ddd
        }
    </style>
</head>

<body>
    <form>
        <table>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
            <tr>
                <td><input></td>
                <td><input></td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td><input></td>
                <td><input></td>
                <td><input type="number"></td>
            </tr>
        </table><button>Save</button>
    </form>
</body>

</html>
