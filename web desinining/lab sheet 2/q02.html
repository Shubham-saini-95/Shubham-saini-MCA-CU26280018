<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
    <style>
        body {
            font-family: Arial
        }

        input {
            display: block;
            margin: 8px;
            padding: 7px;
            width: 280px
        }
    </style>
</head>

<body>
    <h2>Student Registration</h2>
    <form>
        <input type="text" placeholder="Name" required minlength="3" maxlength="30">
        <input type="email" placeholder="Email" required>
        <input type="text" placeholder="Phone" pattern="[0-9]{10}" required>
        <input type="password" placeholder="Password" minlength="6" maxlength="15" required>
        <button type="submit">Register</button>
    </form>
</body>

</html>
