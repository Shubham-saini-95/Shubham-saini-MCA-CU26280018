<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background: #eee
        }

        .card {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 15px #999;
            position: relative
        }

        .card h2 {
            text-align: center
        }

        .card input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0
        }

        .card button {
            width: 100%;
            padding: 10px
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Login</h2><input type="text" placeholder="Username"><input type="password"
            placeholder="Password"><button>Login</button>
    </div>
</body>

</html>
