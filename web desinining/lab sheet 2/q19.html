<!DOCTYPE html>
<html>

<head>
    <title>Typography Form</title>
    <style>
        label {
            font-family: Arial;
            line-height: 2;
            letter-spacing: 1px;
            text-transform: uppercase
        }

        input {
            font-family: Arial;
            line-height: 1.5;
            letter-spacing: 1px
        }

        input::placeholder {
            font-family: Arial;
            letter-spacing: 1px;
            text-transform: capitalize
        }
    </style>
</head>

<body>
    <form><label>Name</label><input placeholder="enter your name"><br><label>Email</label><input
            placeholder="enter your email"><br><button>Register</button></form>
</body>

</html>
