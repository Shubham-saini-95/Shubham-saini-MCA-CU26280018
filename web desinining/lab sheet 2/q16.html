<!DOCTYPE html>
<html>

<head>
    <title>Employee Evaluation</title>
    <style>
        label {
            float: left;
            width: 120px;
            margin: 8px
        }

        input,
        select {
            float: left;
            margin: 8px;
            padding: 7px
        }

        .row {
            clear: both
        }
    </style>
</head>

<body>
    <h2>Employee Evaluation</h2>
    <form>
        <div class="row"><label>Name</label><input></div>
        <div class="row"><label>Department</label><input></div>
        <div class="row"><label>Rating</label><select>
                <option>Excellent</option>
                <option>Good</option>
                <option>Average</option>
            </select></div>
        <div class="row"><button>Submit</button></div>
    </form>
</body>

</html>
