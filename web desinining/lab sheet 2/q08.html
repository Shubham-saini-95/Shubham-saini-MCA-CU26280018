<!DOCTYPE html>
<html>

<head>
    <title>File Upload</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px
        }

        button {
            padding: 10px 20px;
            border: 0;
            background: #333;
            color: white;
            transition: .3s
        }

        button:hover {
            transform: scale(1.05);
            background: #555
        }

        button:active {
            transform: scale(.95)
        }
    </style>
</head>

<body>
    <h2>Upload File</h2>
    <form><input type="file"><br><br><button type="submit">Submit</button></form>
</body>

</html>
