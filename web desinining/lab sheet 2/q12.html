<!DOCTYPE html>
<html>

<head>
    <title>Payment</title>
    <style>
        body {
            font-family: Arial
        }

        .box {
            max-width: 500px;
            margin: auto
        }

        .box input {
            /* width: 100%; */
            box-sizing: border-box;
            padding: 10px;
            margin: 7px 0
        }

         @media(max-width:600px) {
            .box {
                padding: 15px
            }

            .box input {
                width: 100%
            }
        } 22    </style>
</head>

<body>
    <div class="box">
        <h2>Payment Checkout</h2><input placeholder="Card Number"><input placeholder="Name on Card"><input
            placeholder="Expiry"><input placeholder="CVV"><button>Pay Now</button>
    </div>
</body>

</html>
