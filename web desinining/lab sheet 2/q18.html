<!DOCTYPE html>
<html>

<head>
    <title>Contact Us</title>
    <style>
        .container {
            display: flex;
            gap: 30px;
            padding: 30px;
            font-family: Arial
        }

        .form,
        .location {
            flex: 1;
            padding: 20px
        }

        .form input,
        .form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0
        }

        @media(max-width:600px) {
            .container {
                flex-direction: column
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form">
            <h2>Contact Us</h2><input placeholder="Name"><input placeholder="Email"><textarea
                placeholder="Message"></textarea><button>Send</button>
        </div>
        <div class="location">
            <h2>Company Location</h2>
            <p>COER University, Roorkee</p>
            <p>Uttarakhand, India</p>
        </div>
    </div>
</body>

</html>
